<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图文编辑器 · 公开演示</title><style>:root{--cream:#f8faf6;--cream-dark:#edf2e7;--white:#fff;--ink:#29342a;--ink-light:#72806e;--green:#709b38;--green-deep:#40592e;--line:#dfe8da;--yellow-soft:#eef3d9;--font-head:Georgia,SimSun,serif;--font-body:"Microsoft YaHei",sans-serif;--text-lg:20px;--text-sm:14px;--text-xs:12px;--radius-sm:6px;--radius-xs:4px;--radius-md:10px;--shadow-card:0 4px 18px #26332614}
*{box-sizing:border-box}body{margin:0;background:var(--cream-dark);color:var(--ink);font-family:var(--font-body)}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,[contenteditable]:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--green);outline-offset:4px}button:disabled{cursor:wait;opacity:.6}
.vv-btn{border:1px solid var(--green);background:var(--cream);color:var(--ink);border-radius:var(--radius-xs);padding:10px 16px;min-height:44px;font-size:var(--text-sm);font-weight:700}.vv-btn--primary{background:var(--green);color:var(--white)}.vv-btn[aria-pressed=true]{background:var(--yellow)}
.toolbar{position:sticky;top:0;z-index:10;background:var(--cream);border-bottom:1px solid var(--line);padding:16px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}.brand{margin-right:auto}.brand h1{font-family:var(--font-head);font-size:var(--text-lg);margin:0}.brand small{font-size:var(--text-xs);color:var(--ink-light)}.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar label{font-size:var(--text-sm)}select{background:var(--cream);border:1px solid var(--line);padding:10px;color:var(--ink)}
.notice{max-width:1280px;margin:24px auto;padding:0 24px;color:var(--ink-light);font-size:var(--text-sm);line-height:1.8}.notice p{margin:4px 0}.notice strong{color:var(--ink)}#save-state{color:var(--green-deep)}.page-nav{display:flex;gap:8px;flex-wrap:wrap}.page-nav a{padding:8px 12px;color:var(--ink);text-decoration:none;background:var(--cream);border-radius:var(--radius-xs)}
.sheet{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:32px;padding:16px 24px 64px}.page-wrap{scroll-margin-top:140px;--scale:.5}.page-meta{display:flex;justify-content:space-between;align-items:center;min-height:44px;margin-bottom:12px;gap:8px;font-size:var(--text-sm)}.page-meta label{display:flex;align-items:center;gap:6px}.page-meta input{width:64px;border:1px solid var(--line);background:var(--cream);padding:6px}.canvas-wrap{position:relative;width:calc(1080px * var(--scale));height:calc(1440px * var(--scale));overflow:hidden}
/* Fixed pixels are the intentional 1080×1440 publishing canvas, not the responsive editor UI. */
.poster{width:1080px;height:1440px;position:relative;padding:64px;background:var(--cream);transform:scale(var(--scale));transform-origin:top left;display:flex;flex-direction:column;gap:32px;--poster-body:34px;--poster-head:76px;--poster-small:28px;--poster-gap:32px;overflow:hidden}
.poster .eyebrow{font-size:26px;letter-spacing:.04em;font-weight:700;color:var(--green);display:flex;justify-content:space-between}.poster h2{margin:0;font-family:var(--font-head);font-size:var(--poster-head);font-weight:800;line-height:1.28;letter-spacing:-.025em;white-space:pre-wrap}.poster .lead{font-size:var(--poster-body);line-height:1.65;margin:0;white-space:pre-wrap}.page-content{display:flex;flex-direction:column;gap:32px;flex:1;min-height:0}.poster h3{font-size:40px;font-weight:800;font-family:var(--font-head);margin:0 0 16px;line-height:1.4;white-space:pre-wrap}.poster p{font-size:var(--poster-body);line-height:1.65;margin:0;white-space:pre-wrap}.poster .product{font-family:var(--font-editorial);font-weight:700;font-size:42px;margin:0 0 12px}.poster .note{font-size:var(--poster-small);line-height:1.6;margin-top:auto;color:var(--ink-light);white-space:pre-wrap}.poster footer{font-size:24px;display:flex;justify-content:space-between;align-items:center;color:var(--green);padding-top:16px;border-top:1px solid var(--line)}
.editable{min-width:0}body.editing .editable{cursor:text}body.editing .editable:hover{outline:2px dashed var(--line);outline-offset:4px}body.editing .editable:focus{outline:none;background:var(--yellow-soft)}.art-slot{position:relative;width:100%;min-height:160px}.art-slot svg{display:block;width:100%;height:100%;color:var(--green)}.art-slot img{width:100%;height:100%;object-fit:contain;display:block}.art-caption{font-size:24px!important;color:var(--ink-light);margin-top:8px!important}.replace-art{position:absolute;right:12px;top:12px;display:none}body.editing .replace-art{display:block}.art-controls{display:none;gap:8px}body.editing .art-controls{display:flex}.art-controls .vv-btn{font-size:24px;padding:8px 12px}.page-meta .edit-only{display:none}body.editing .page-meta .edit-only{display:flex}.band{background:var(--yellow-soft);padding:32px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:32px}.block{padding:28px;background:var(--cream-dark)}
.cover h2{font-size:94px}.cover .lead{font-size:42px}.cover .art-slot{height:320px}.cover .band{margin-top:auto}.library .art-slot{height:240px}.library .page-content{gap:24px}.library h3{font-size:38px;margin-bottom:8px}.library .block{padding:24px}.library .product{font-size:38px;margin:0 0 6px}.library .pair{gap:24px;grid-template-columns:1fr 1fr}.library .note{font-size:28px}.search .art-slot{height:340px}.search .lead,.connections .lead{font-family:var(--font-editorial);font-size:52px;font-weight:700;color:var(--green)}.canvas .art-slot{height:280px}.canvas .block{padding:28px}.canvas h3{font-size:42px}.canvas .pair{gap:24px}.canvas .pair p{font-size:32px}.connections .art-slot{height:340px}.decision .decision-row{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;padding:24px 0;border-bottom:1px solid var(--line)}.decision h3{font-size:34px;margin:0}.decision .decision-row p{font-size:34px;font-weight:700;color:var(--green-deep)}.question{background:var(--yellow);padding:40px;font-family:var(--font-head);font-size:52px!important;font-weight:800;line-height:1.45!important;white-space:pre-wrap}.overflow-note{color:var(--status-error);font-weight:700}.overflow-note:empty{display:none}
.connections .art-slot{height:260px}.connections .page-content{gap:24px}
/* Editing controls overlay the image; they must never consume publishing space. */
.art-controls{display:none!important}.restore-art{position:absolute;bottom:12px;right:12px;display:none}body.editing .restore-art{display:block}
.copy-area{max-width:1080px;margin:0 auto 64px;padding:32px;background:var(--cream);border:1px solid var(--line)}.copy-area h2{font-family:var(--font-head);margin:0 0 16px}.vv-field{display:block;margin-bottom:24px}.vv-field span{font-weight:700;display:block;margin-bottom:8px}.vv-field textarea{resize:vertical;width:100%;line-height:1.7;border:1px solid var(--line);border-radius:var(--radius-xs);background:var(--cream);color:var(--ink);padding:12px;min-height:52px;overflow:hidden}.copy-actions{display:flex;gap:8px;flex-wrap:wrap}.copy-area details{margin-top:24px;color:var(--ink-light)}.copy-area summary{cursor:pointer;font-weight:700}.copy-area a{color:var(--green-deep)}.copy-area .sources{list-style:none;padding:0;line-height:2}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:700px){.toolbar{position:relative;padding:16px}.brand{width:100%}.sheet{padding:0 12px 32px;gap:24px}.page-meta{flex-wrap:wrap}.notice{padding:0 16px}.copy-area{margin:0 12px 32px;padding:20px}.tools{gap:6px}.vv-btn{padding:8px 10px}.page-wrap{scroll-margin-top:16px}}
@media print{.toolbar,.notice,.page-meta,.copy-area,.replace-art,.art-controls{display:none!important}.sheet{display:block;padding:0}.page-wrap,.canvas-wrap{width:1080px;height:1440px;margin:0}.poster{transform:none;break-after:page}.page-wrap{break-after:page}.editable{outline:none!important;background:transparent!important}@page{size:1080px 1440px;margin:0}}

/* Photo-first publishing layout: real product interface images, no conceptual drawings. */
.poster{padding:56px;gap:24px;--poster-head:72px}.poster .eyebrow{font-size:26px}.poster .lead{font-size:34px}.poster .note{font-size:26px}.poster footer{font-size:24px}.photo-gallery{flex:1;min-height:0;display:flex;flex-direction:column;gap:24px}.photo-figure{margin:0;display:flex;flex-direction:column;min-height:0;flex:1;gap:10px}.photo-media{position:relative;flex:1;min-height:0;background:var(--cream-dark);overflow:hidden;border-radius:var(--radius-sm)}.photo-media img{height:100%;width:100%;display:block;object-fit:contain}.photo-figure figcaption{display:flex;align-items:baseline;justify-content:space-between;gap:12px}.photo-figure h3{font-family:var(--font-editorial);font-size:40px;margin:0}.photo-figure .credit{font-size:22px;color:var(--ink-light);white-space:nowrap}.photo-figure p{font-size:32px;line-height:1.45}.photo-cover h2{font-size:86px}.photo-cover .photo-gallery,.photo-decision .photo-gallery{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:24px}.photo-cover .photo-figure p,.photo-cover .photo-figure .credit{display:none}.photo-cover .photo-media img,.photo-decision .photo-media img{object-fit:cover;object-position:left top}.photo-cover .photo-figure h3{font-size:34px}.photo-cover .photo-gallery{min-height:600px}.photo-double .photo-media img{object-fit:cover;object-position:left top}.photo-single .photo-media img{object-fit:contain}.photo-tall .photo-media img{object-fit:cover;object-position:left top}.photo-decision .photo-figure h3{font-family:var(--font-head);font-size:30px}.photo-decision .photo-figure p{font-size:30px;font-weight:700;color:var(--green-deep)}.photo-decision .credit{display:none}.photo-decision .photo-gallery{min-height:480px}.photo-decision .question{font-size:48px!important;padding:28px}.photo-cover .note{font-size:24px}.export .toolbar,.export .notice,.export .page-meta,.export .copy-area,.export .replace-art,.export .restore-art{display:none!important}.export .sheet{display:block;margin:0;padding:0}.export .page-wrap,.export .canvas-wrap{width:1080px;height:1440px}.export .poster{transform:none}.export .page-wrap{margin:0}.export{background:var(--cream)}
.photo-figure p{font-size:calc(var(--poster-body) - 2px)}.poster .lead{font-size:var(--poster-body)}.photo-decision .photo-figure p{font-size:calc(var(--poster-body) - 4px)}
