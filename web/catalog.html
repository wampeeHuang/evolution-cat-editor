<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>进化猫图文编辑器</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/web/catalog.css"><script src="/web/catalog.js" defer></script></head>
<body><a class="skip" href="#contents">跳到内容列表</a><header><div class="container"><h1>图文</h1><p id="summary">正在读取内容…</p></div></header><main class="container" id="contents"><div class="controls"><nav id="categories" aria-label="按分类筛选"></nav><div class="tools"><label><span class="sr">搜索图文</span><input id="search" type="search" placeholder="搜索标题或文件夹" autocomplete="off"></label><label><span class="sr">排序方式</span><select id="sort" aria-label="排序方式"><option value="opened-desc">最近打开优先</option><option value="opened-asc">最早打开优先</option><option value="name-asc">名称顺序</option><option value="created-desc">最新创建优先</option><option value="created-asc">最早创建优先</option></select></label></div></div><details><summary>管理分类</summary><form id="category-form"><label for="new-category">新增分类</label><input id="new-category" maxlength="20" autocomplete="off" required placeholder="例如：学习方法"><button type="submit">添加</button></form></details><p id="feedback" role="status" aria-live="polite"></p><div class="table-wrap"><table><caption class="sr">图文列表</caption><thead><tr><th>图文名称</th><th>分类</th><th>本地文件夹</th><th><button data-sort="created">创建时间 ↕</button></th><th><button data-sort="opened">最近打开 ↕</button></th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty" hidden>没有符合条件的图文。试试其他分类或关键词。</p></main></body></html>
