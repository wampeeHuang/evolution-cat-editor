<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>进化猫图文编辑器</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/web/catalog.css"><script src="/web/catalog.js" defer></script></head>
<body><a class="skip" href="#contents">跳到内容列表</a><header><div class="container"><h1>图文</h1><p id="summary">正在读取内容…</p></div></header><main class="container" id="contents"><div class="controls"><div class="category-group"><nav id="categories" aria-label="按分类筛选"></nav><details id="more-categories" hidden><summary>其它⌄</summary><div id="more-options" class="popup"></div></details><details id="add-category"><summary aria-label="新增分类" title="新增分类"><svg aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 4v12M4 10h12"/></svg></summary><div class="popup"><form id="category-form"><label for="new-category">新增分类</label><input id="new-category" maxlength="20" autocomplete="off" required placeholder="例如：学习方法"><button type="submit">添加</button></form></div></details></div><div class="tools">
<details id="search-pop"><summary aria-label="搜索图文" title="搜索"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg></summary><div class="popup"><label for="search">搜索标题或文件夹</label><input id="search" type="search" autocomplete="off" placeholder="输入关键词"></div></details>
<details id="filter-pop"><summary aria-label="按日期筛选" title="按日期筛选"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 4h14l-5 6v6l-4 1v-7z"/></svg></summary><div class="popup"><label for="date-field">筛选时间</label><select id="date-field"><option value="created">创建时间</option><option value="lastOpened">最近打开时间</option></select><label for="date-from">起始日期</label><input id="date-from" type="date"><label for="date-to">结束日期</label><input id="date-to" type="date"><button id="clear-date" type="button">清除日期筛选</button></div></details>
<details id="sort-pop"><summary aria-label="选择排序方式" title="排序"><svg aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 5h14M3 10h10M3 15h6M15 9v8m-2-2 2 2 2-2"/></svg></summary><div class="popup sort-options"><button data-sort-value="opened-desc">最近打开优先</button><button data-sort-value="opened-asc">最早打开优先</button><button data-sort-value="name-asc">名称顺序</button><button data-sort-value="created-desc">最新创建优先</button><button data-sort-value="created-asc">最早创建优先</button></div></details><select id="sort" aria-label="排序方式" hidden><option value="opened-desc">最近打开优先</option><option value="opened-asc">最早打开优先</option><option value="name-asc">名称顺序</option><option value="created-desc">最新创建优先</option><option value="created-asc">最早创建优先</option></select></div></div><p id="feedback" role="status" aria-live="polite"></p><div class="table-wrap"><table><caption class="sr">图文列表</caption><thead><tr><th>图文名称</th><th>图卡数</th><th>分类</th><th>本地文件夹</th><th><button data-sort="created">创建时间 ↕</button></th><th><button data-sort="opened">最近打开 ↕</button></th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty" hidden>没有符合条件的图文。试试其他分类或关键词。</p></main></body></html>
